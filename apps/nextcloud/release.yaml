apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: nextcloud-release
    namespace: nextcloud
spec:
    interval: 1m
    chart:
        spec:
            chart: nextcloud
            version: 9.4.1
            sourceRef:
                kind: HelmRepository
                name: nextcloud-repo
    values:
        ingress:
            enabled: true
            host: ENC[AES256_GCM,data:iY3bZuTl002waT8elOEd9maB0eS1jKNs2A9gZ+0=,iv:Wi0Dq7JwL8Oral7MwWQpF/zr4+BRepdz1ss5FRZBHts=,tag:i367Be2NPthZqrzNhZEI1Q==,type:str]
            annotations:
                cert-manager.io/cluster-issuer: cloudflare-issuer
                traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
                traefik.ingress.kubernetes.io/router.middlewares: infra-redirect-https@kubernetescrd
            tls:
                - hosts:
                    - ENC[AES256_GCM,data:fZzY+fuKL9zyL4gvEo4etfYVLadh0QccVyH4Xqw=,iv:ttRCJZIejipRAVuVkY/DR6wzb/zLh7MX3AgC7PqRvB0=,tag:QYmE2liBB+TO25L92IgyQw==,type:str]
                  secretName: nextcloud-cert
        phpClientHttpsFix:
            enabled: true
            protocol: https
        nextcloud:
            host: ENC[AES256_GCM,data:C9kDB/weUIpHeyIiQFZkUhsClqLCatH9+oaO3TA=,iv:cPeSpBbJZupBGPy9su9n6EWlHDGMgpx7TT1Sm7iW2qI=,tag:6TSqP2yzX2WKjXBQUVrlMg==,type:str]
            existingSecret:
                enabled: true
                secretName: nextcloud-app-secret
                usernameKey: username
                passwordKey: password
        internalDatabase:
            enabled: false
        externalDatabase:
            enabled: true
            type: postgresql
            database: nextcloud
            user: nextcloud
            existingSecret:
                enabled: true
                secretName: nextcloud-db-secret
                usernameKey: username
                passwordKey: userPassword
        postgresql:
            enabled: true
            global:
                postgresql:
                    auth:
                        username: nextcloud
                        database: nextcloud
                        existingSecret: nextcloud-db-secret
                        secretKeys:
                            adminPasswordKey: adminPassword
                            userPasswordKey: userPassword
                            replicationPasswordKey: replicationPassword
            primary:
                persistence:
                    enabled: true
                    existingClaim: nextcloud-db-pvc
        redis:
            enabled: true
            auth:
                enabled: true
                existingSecret: nextcloud-redis-secret
                existingSecretPasswordKey: password
            master:
                persistence:
                    enabled: false
                replica:
                    persistence:
                        enabled: false
        persistence:
            enabled: true
            existingClaim: nextcloud-app-pvc
            nextcloudData:
                enabled: true
                existingClaim: nextcloud-data-pvc
        cronjob:
            enabled: true
            type: sidecar
        livenessProbe:
            enabled: false
        readinessProbe:
            enabled: false
        startupProbe:
            enabled: false
