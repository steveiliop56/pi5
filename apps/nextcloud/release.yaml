apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: nextcloud-release
    namespace: nextcloud
spec:
    interval: 1m
    chart:
        spec:
            chart: nextcloud
            version: 9.4.1
            sourceRef:
                kind: HelmRepository
                name: nextcloud-repo
    values:
        ingress:
            enabled: true
            className: traefik
            host: ENC[AES256_GCM,data:0N/rwcknBrSjECholSrXaxKgWSX0+SmQ7n6TONw=,iv:QKGV+TBQG6VMiVzR8ZAnPTziBerkMD6u4q4CjZYOtuU=,tag:Fcsx4y6psCJbrYGxbxtD/w==,type:str]
            annotations:
                cert-manager.io/cluster-issuer: cloudflare-issuer
                traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
                traefik.ingress.kubernetes.io/router.middlewares: infra-redirect-https@kubernetescrd
            tls:
                - hosts:
                    - ENC[AES256_GCM,data:wrruCG9DiuW5egcLwzOikPAR9e2jEC0KiabfifE=,iv:L2IvNatBXvT0H3p+MfVMziEyMq5zcgmbTQGXl9/IN34=,tag:wh7YBNRX0ljO4N1cX9uR9Q==,type:str]
                  secretName: nextcloud-cert
        phpClientHttpsFix:
            enabled: true
            protocol: https
        nextcloud:
            host: ENC[AES256_GCM,data:PS+lMRavE8ZuMM1Nqhh4Mb5Lb1nD4IgDNxTC4ac=,iv:jeFOq7Qe9E7PIUGwh3at4cNj/z9+ISLUMdIi9Rf7Q6s=,tag:yXNK2RcSTSO9do3nSrt9MA==,type:str]
            existingSecret:
                enabled: true
                secretName: nextcloud-app-secret
                usernameKey: username
                passwordKey: password
        internalDatabase:
            enabled: false
        externalDatabase:
            enabled: true
            type: postgresql
            database: nextcloud
            user: nextcloud
            existingSecret:
                enabled: true
                secretName: nextcloud-db-secret
                usernameKey: username
                passwordKey: userPassword
        postgresql:
            enabled: true
            global:
                postgresql:
                    auth:
                        username: nextcloud
                        database: nextcloud
                        existingSecret: nextcloud-db-secret
                        secretKeys:
                            adminPasswordKey: adminPassword
                            userPasswordKey: userPassword
                            replicationPasswordKey: replicationPassword
            primary:
                persistence:
                    enabled: true
                    existingClaim: nextcloud-db-pvc
        redis:
            enabled: false
        externalRedis:
            enabled: false
        persistence:
            enabled: true
            existingClaim: nextcloud-app-pvc
            nextcloudData:
                enabled: true
                existingClaim: nextcloud-data-pvc
        cronjob:
            enabled: true
            type: sidecar
