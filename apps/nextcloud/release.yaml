apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: nextcloud-release
    namespace: nextcloud
spec:
    interval: 1m
    chart:
        spec:
            chart: nextcloud
            version: 9.4.1
            sourceRef:
                kind: HelmRepository
                name: nextcloud-repo
    values:
        ingress:
            enabled: true
            className: traefik
            host: ENC[AES256_GCM,data:uz4bUYwPx1iDcwXs9HxXHWXT3c65wPBPNGWCUxg=,iv:6TJQJuBqPnh0+NULo5utjRFXeQrP8eNwmelI9rs+2zY=,tag:tF70mZWsa1/guTEtZD8jWw==,type:str]
            annotations:
                cert-manager.io/cluster-issuer: cloudflare-issuer
                traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
                traefik.ingress.kubernetes.io/router.middlewares: infra-redirect-https@kubernetescrd
            tls:
                - hosts:
                    - ENC[AES256_GCM,data:tcZl5hs+sPKNqV0hEFVZsUj2iSqCnzgXN6SFC0s=,iv:Pw/gf5YD8uo0PMTX2AkLdqRblsy/dag7pFUZs9naMbU=,tag:O+yAulykw7oA1kj+3Bf3iA==,type:str]
                  secretName: nextcloud-cert
        phpClientHttpsFix:
            enabled: true
            protocol: https
        nextcloud:
            host: ENC[AES256_GCM,data:83+OdN666rzvV7xBN9mo3Jio8z7OQzWTQ2nkY5w=,iv:LDAdmNUVIY3Wa7lPP7n7UVlR8g5zJp1gChDWKqv1Imc=,tag:pQoqsxGw1WVMG8NKt2P2XA==,type:str]
            existingSecret:
                enabled: true
                secretName: nextcloud-app-secret
                usernameKey: username
                passwordKey: password
        internalDatabase:
            enabled: false
        externalDatabase:
            enabled: true
            type: postgresql
            database: nextcloud
            user: nextcloud
            existingSecret:
                enabled: true
                secretName: nextcloud-db-secret
                usernameKey: username
                passwordKey: userPassword
        postgresql:
            enabled: true
            global:
                postgresql:
                    auth:
                        username: nextcloud
                        database: nextcloud
                        existingSecret: nextcloud-db-secret
                        secretKeys:
                            adminPasswordKey: adminPassword
                            userPasswordKey: userPassword
                            replicationPasswordKey: replicationPassword
            primary:
                persistence:
                    enabled: true
                    existingClaim: nextcloud-db-pvc
        redis:
            enabled: false
        externalRedis:
            enabled: false
        persistence:
            enabled: true
            existingClaim: nextcloud-app-pvc
            nextcloudData:
                enabled: true
                existingClaim: nextcloud-data-pvc
        cronjob:
            enabled: true
            type: cronjob
            cronjob:
                schedule: '*/5 * * * *'
