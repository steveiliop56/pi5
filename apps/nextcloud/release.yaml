apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: nextcloud-release
    namespace: nextcloud
spec:
    interval: 1m
    chart:
        spec:
            chart: nextcloud
            version: 9.4.1
            sourceRef:
                kind: HelmRepository
                name: nextcloud-repo
    values:
        ingress:
            enabled: true
            host: ENC[AES256_GCM,data:okXPAPQ5eAlnONykU6anJsOc3EpHnGYRpKAQMrE=,iv:f3jN8JMfAu8yh+BSkGc4HsPwR4884jL6o52dKoPz1Dk=,tag:MQoYvj13WVpsItMU5mcvMg==,type:str]
            annotations:
                cert-manager.io/cluster-issuer: cloudflare-issuer
                traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
                traefik.ingress.kubernetes.io/router.middlewares: infra-redirect-https@kubernetescrd
            tls:
                - hosts:
                    - ENC[AES256_GCM,data:AyzEEk6cJ72cQE/IKzMEV21wt4Leh87W2KFB4vA=,iv:ovSpCv8ZFYf0yc4/q10ghBoVlGDPtNk9lUBTdIY7fDM=,tag:npmHa1F/sq1427td7qWiPg==,type:str]
                  secretName: nextcloud-cert
        phpClientHttpsFix:
            enabled: true
            protocol: https
        nextcloud:
            host: ENC[AES256_GCM,data:2e9tNoaQSJWExqS+OwkiZRC8BnHXhDiMF9gUw2M=,iv:Db6fuL2ndt7FPsFBi10agxBgmlHs8fBeF/cB2jWQpk0=,tag:F+zHcsYoAvxWDuBsI1mrCg==,type:str]
            existingSecret:
                enabled: true
                secretName: nextcloud-app-secret
                usernameKey: username
                passwordKey: password
        internalDatabase:
            enabled: false
        externalDatabase:
            enabled: true
            type: postgresql
            database: nextcloud
            user: nextcloud
            existingSecret:
                enabled: true
                secretName: nextcloud-db-secret
                usernameKey: username
                passwordKey: userPassword
        postgresql:
            enabled: true
            global:
                postgresql:
                    auth:
                        username: nextcloud
                        database: nextcloud
                        existingSecret: nextcloud-db-secret
                        secretKeys:
                            adminPasswordKey: adminPassword
                            userPasswordKey: userPassword
                            replicationPasswordKey: replicationPassword
            primary:
                persistence:
                    enabled: true
                    existingClaim: nextcloud-db-pvc
        redis:
            enabled: true
            auth:
                enabled: true
                existingSecret: nextcloud-redis-secret
                existingSecretPasswordKey: password
            master:
                persistence:
                    enabled: false
                replica:
                    persistence:
                        enabled: false
        persistence:
            enabled: true
            existingClaim: nextcloud-app-pvc
            nextcloudData:
                enabled: true
                existingClaim: nextcloud-data-pvc
        cronjob:
            enabled: true
            type: sidecar
